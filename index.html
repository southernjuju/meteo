<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aperçu arc solaire</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: linear-gradient(160deg, #1a3a6b 0%, #2d6fa8 40%, #5ba3d0 70%, #a8d4f0 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: 'Nunito', sans-serif;
  }

  .card {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(20px);
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,0.18);
    padding: 2rem 3rem;
    display: flex; flex-direction: column; align-items: center; gap: 0.8rem;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    min-width: 380px;
    position: relative; overflow: hidden;
  }
  .card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 2px; border-radius: 18px 18px 0 0;
    background: linear-gradient(90deg, #f4d03f, transparent);
  }

  .big-clock {
    font-family: 'DM Mono', monospace; font-size: 5rem; font-weight: 400;
    color: #f4d03f; text-shadow: 0 0 40px rgba(244,208,63,0.4);
    line-height: 1; letter-spacing: 0.05em;
  }
  .big-date {
    font-family: 'DM Mono', monospace; font-size: 1rem;
    color: rgba(255,255,255,0.5); letter-spacing: 0.2em; text-transform: uppercase;
  }

  /* SUN ARC */
  .sun-arc-container {
    width: 100%; position: relative; margin-top: 0.5rem;
  }

  .sun-arc-svg { width: 100%; overflow: visible; }

  .arc-path {
    fill: none;
    stroke: rgba(255,255,255,0.15);
    stroke-width: 1.5;
    stroke-dasharray: 4 4;
  }
  .arc-path-glow {
    fill: none;
    stroke: rgba(244,208,63,0.3);
    stroke-width: 3;
    stroke-linecap: round;
  }

  .sun-labels {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 0.3rem; padding: 0 0.5rem;
  }
  .sun-label {
    font-family: 'DM Mono', monospace; font-size: 1rem;
    color: rgba(255,255,255,0.5); display: flex; align-items: center; gap: 0.3rem;
  }


  .day-progress {
    font-family: 'DM Mono', monospace; font-size: 0.65rem;
    color: rgba(255,255,255,0.3); text-align: center; margin-top: 0.2rem;
  }
</style>
</head>
<body>

<div class="card">
  <div class="big-clock" id="big-clock"></div>
  <div class="big-date" id="big-date"></div>

  <div class="sun-arc-container">
    <svg class="sun-arc-svg" id="sun-svg" viewBox="0 0 300 90" preserveAspectRatio="none">
      <!-- Dashed arc background -->
      <path class="arc-path" id="arc-bg" d=""/>
      <!-- Glowing arc (progress) -->
      <path class="arc-path-glow" id="arc-progress" d=""/>
      <!-- Horizon line -->
      <line x1="10" y1="80" x2="290" y2="80" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <!-- Sun emoji -->
      <text id="sun-icon" font-size="18" text-anchor="middle" dominant-baseline="middle"></text>
    </svg>
    <div class="sun-labels">
      <span class="sun-label rise" id="rise-label">🌅 07:54</span>
      <span class="sun-label" id="day-pct"></span>
      <span class="sun-label set" id="set-label">🌇 18:48</span>
    </div>
  </div>
</div>

<script>
// Simulated sunrise/sunset (will come from Open-Meteo in real version)
const SUNRISE = { h: 7, m: 54 };
const SUNSET  = { h: 18, m: 48 };

function toMinutes(h, m) { return h * 60 + m; }

function arcPoint(t, w=300, h=80, margin=10) {
  // t = 0 (sunrise) to 1 (sunset), arc = half ellipse
  const x = margin + t * (w - 2*margin);
  const y = h - Math.sin(t * Math.PI) * (h - 10);
  return { x, y };
}

function buildArcPath(from=0, to=1, steps=60) {
  let d = '';
  for (let i = 0; i <= steps; i++) {
    const t = from + (to - from) * (i / steps);
    const p = arcPoint(t);
    d += (i === 0 ? 'M' : 'L') + `${p.x.toFixed(1)},${p.y.toFixed(1)} `;
  }
  return d;
}

function updateSun() {
  const now = new Date();
  const nowMin = toMinutes(now.getHours(), now.getMinutes()) + now.getSeconds() / 60;
  const riseMin = toMinutes(SUNRISE.h, SUNRISE.m);
  const setMin  = toMinutes(SUNSET.h, SUNSET.m);

  // t = progress 0..1 through the day
  let t = (nowMin - riseMin) / (setMin - riseMin);
  t = Math.max(0, Math.min(1, t));

  // Draw full arc
  document.getElementById('arc-bg').setAttribute('d', buildArcPath(0, 1));

  // Draw progress arc
  document.getElementById('arc-progress').setAttribute('d', buildArcPath(0, t));

  // Position sun
  const sunEl = document.getElementById('sun-icon');
  const pos = arcPoint(t);
  sunEl.setAttribute('x', pos.x);
  sunEl.setAttribute('y', pos.y);

  const isDay = t > 0 && t < 1;
  sunEl.textContent = isDay ? '☀️' : (nowMin < riseMin ? '🌙' : '🌙');

  // Labels
  document.getElementById('rise-label').textContent = `${SUNRISE.h.toString().padStart(2,'0')}:${SUNRISE.m.toString().padStart(2,'0')}`;
  document.getElementById('set-label').textContent  = `${SUNSET.h.toString().padStart(2,'0')}:${SUNSET.m.toString().padStart(2,'0')}`;

  document.getElementById('day-pct').textContent = '';
}

function updateClock() {
  const now = new Date();
  document.getElementById('big-clock').textContent =
    now.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  document.getElementById('big-date').textContent =
    now.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
}

setInterval(updateClock, 1000);
setInterval(updateSun, 10000);
updateClock();
updateSun();
</script>
</body>
</html>
