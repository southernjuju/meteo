<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netatmo Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Nunito', sans-serif;
    height: 100vh;
    overflow: hidden;
    transition: background 2s ease;
  }

  .bg-dawn {
    background:
      radial-gradient(ellipse at 30% 60%, rgba(255,160,50,0.5) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 30%, rgba(255,100,100,0.3) 0%, transparent 50%),
      linear-gradient(160deg, #1a1a3a 0%, #6b3a5e 40%, #d4785a 70%, #f0b080 100%);
  }
  .bg-day {
    background:
      radial-gradient(ellipse at 20% 20%, rgba(255,220,100,0.4) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 60%, rgba(100,180,255,0.3) 0%, transparent 50%),
      linear-gradient(160deg, #1a3a6b 0%, #2d6fa8 40%, #5ba3d0 70%, #a8d4f0 100%);
  }
  .bg-sunset {
    background:
      radial-gradient(ellipse at 20% 70%, rgba(255,120,30,0.6) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 30%, rgba(200,60,100,0.3) 0%, transparent 50%),
      linear-gradient(160deg, #0d0d2a 0%, #3d1c4a 30%, #a03a3a 60%, #e08050 100%);
  }
  .bg-night {
    background:
      radial-gradient(ellipse at 70% 20%, rgba(255,255,180,0.15) 0%, transparent 30%),
      radial-gradient(ellipse at 20% 80%, rgba(100,80,200,0.2) 0%, transparent 40%),
      linear-gradient(160deg, #0a0a1a 0%, #0d1b3e 50%, #1a1040 100%);
  }

  /* AUTH */
  #auth-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; gap: 1.5rem; padding: 2rem;
  }
  .auth-icon { font-size: 3rem; }
  .auth-title {
    font-size: 1.8rem; font-weight: 800; color: white;
    text-shadow: 0 2px 20px rgba(0,0,0,0.3);
  }
  .auth-subtitle { font-size: 0.9rem; color: rgba(255,255,255,0.6); text-align: center; max-width: 300px; line-height: 1.6; }
  .auth-btn {
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    color: white; border: 1px solid rgba(255,255,255,0.3);
    padding: 0.9rem 2.5rem; border-radius: 50px;
    font-family: 'Nunito', sans-serif; font-size: 0.95rem; font-weight: 800;
    cursor: pointer; transition: all 0.2s;
  }
  .auth-btn:hover { background: rgba(255,255,255,0.3); transform: scale(1.03); }
  .error-msg { color: #f1948a; font-size: 0.8rem; text-align: center; display: none; }

  /* LOADING */
  #loading {
    display: none; position: fixed; inset: 0;
    align-items: center; justify-content: center; flex-direction: column; gap: 1rem; z-index: 100;
  }
  .loading-spinner {
    width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.2);
    border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 0.85rem; color: rgba(255,255,255,0.6); }

  /* STARS */
  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0; transition: opacity 1s; }
  .star { position: absolute; background: white; border-radius: 50%; animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 0%,100%{opacity:0.8} 50%{opacity:0.2} }
  body.night .stars { opacity: 1; }

  /* DASHBOARD */
  #dashboard {
    display: none; height: 100vh; flex-direction: column;
    padding: 0.8rem; gap: 0.8rem; position: relative; z-index: 1;
  }

  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.6rem 1.2rem;
    background: rgba(255,255,255,0.1); backdrop-filter: blur(20px);
    border-radius: 14px; border: 1px solid rgba(255,255,255,0.15);
  }
  .station-name { font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.2em; color: rgba(255,255,255,0.7); text-transform: uppercase; }
  .last-update { font-family: 'DM Mono', monospace; font-size: 0.6rem; color: rgba(255,255,255,0.4); margin-top: 0.15rem; }
  .top-clock { font-family: 'DM Mono', monospace; font-size: 0.75rem; color: rgba(255,255,255,0.6); text-align: right; }
  .logout-btn {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.5);
    padding: 0.3rem 0.8rem; border-radius: 20px; font-family: 'Nunito', sans-serif;
    font-size: 0.7rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
  }
  .logout-btn:hover { background: rgba(255,255,255,0.2); color: white; }

  /* GRID */
  .grid {
    display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr);
    gap: 0.8rem; flex: 1; min-height: 0;
  }

  /* GLASS CARD */
  .card {
    background: rgba(255,255,255,0.1); backdrop-filter: blur(20px);
    border-radius: 18px; border: 1px solid rgba(255,255,255,0.18);
    padding: 1rem 1.2rem;
    display: grid; grid-template-rows: 1.5rem 1fr auto;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.2);
    transition: transform 0.2s; position: relative; overflow: hidden;
  }
  .card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 2px; border-radius: 18px 18px 0 0;
  }
  .card:hover { transform: translateY(-2px); }

  .card-indoor1::before { background: linear-gradient(90deg, #58d68d, transparent); }
  .card-outdoor::before { background: linear-gradient(90deg, #5dade2, transparent); }
  .card-extra::before  { background: linear-gradient(90deg, #f0b27a, transparent); }
  .card-rain::before   { background: linear-gradient(90deg, #7fb3d3, transparent); }
  .card-wind::before   { background: linear-gradient(90deg, #bb8fce, transparent); }
  .card-clock::before  { background: linear-gradient(90deg, #f4d03f, transparent); }

  .card-header { display: flex; justify-content: space-between; align-items: center; }
  .card-name { font-size: 0.85rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.6); }

  .big-temp {
    font-size: 4.5rem; font-weight: 800; line-height: 1; color: white;
    text-shadow: 0 2px 15px rgba(0,0,0,0.3);
    position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%);
    white-space: nowrap;
  }
  .card-indoor1 .big-temp { color: #7defa8; }
  .card-outdoor .big-temp { color: #7dd3f8; }
  .card-extra .big-temp  { color: #fcd4a0; }
  .big-temp .deg { font-size: 2.5rem; opacity: 0.6; }

  .metrics { display: flex; flex-direction: column; gap: 0.3rem; justify-content: flex-end; }
  .metric {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.3rem 0.5rem; background: rgba(255,255,255,0.06); border-radius: 8px;
  }
  .metric-label { font-size: 0.8rem; color: rgba(255,255,255,0.5); }
  .metric-value { font-size: 1rem; font-weight: 700; color: rgba(255,255,255,0.9); }
  .metric-value .unit { font-size: 0.6rem; opacity: 0.6; margin-left: 1px; }

  .co2-good { color: #7defa8 !important; }
  .co2-med  { color: #f4d03f !important; }
  .co2-bad  { color: #f1948a !important; }

  /* RAIN / WIND */
  .card-wind { display: grid; grid-template-rows: 1.5rem 1fr; }
  .card-rain { display: flex; flex-direction: column; justify-content: center; }
  .card-rain .metrics, .card-wind .metrics { display: flex; flex-direction: column; justify-content: center; gap: 0.6rem; }
  .card-rain .metric, .card-wind .metric { padding: 0.5rem 0.8rem; border-radius: 10px; }
  .card-rain .metric-label, .card-wind .metric-label { font-size: 0.78rem; }
  .card-rain .metric-value, .card-wind .metric-value { font-size: 1.1rem; font-weight: 800; color: white; }

  /* CLOCK */
  .card-clock {
    grid-column: span 2;
    display: flex !important; flex-direction: column !important;
    align-items: center; justify-content: center; gap: 0.6rem;
  }
  .big-clock {
    font-family: 'DM Mono', monospace; font-size: 6rem; font-weight: 400;
    color: #f4d03f; text-shadow: 0 0 40px rgba(244,208,63,0.4);
    line-height: 1; letter-spacing: 0.05em;
  }
  .big-date {
    font-family: 'DM Mono', monospace; font-size: 1.3rem;
    color: rgba(255,255,255,0.5); letter-spacing: 0.2em; text-transform: uppercase;
  }

  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #58d68d; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .no-data { color: rgba(255,255,255,0.3); }

  /* SUN ARC */
  .sun-arc-wrap { width: 100%; margin-top: 0.6rem; }
  .sun-arc-svg { width: 100%; overflow: visible; }
  .arc-dashed { fill: none; stroke: rgba(255,255,255,0.12); stroke-width: 1.5; stroke-dasharray: 4 4; }
  .arc-glow { fill: none; stroke: rgba(244,208,63,0.35); stroke-width: 3; stroke-linecap: round; }
  .sun-labels {
    display: flex; justify-content: space-between;
    margin-top: 0.3rem; padding: 0 0.5rem;
  }
  .sun-time {
    font-family: 'DM Mono', monospace; font-size: 1rem;
    color: rgba(255,255,255,0.5);
  }

  .metric.empty { background: transparent !important; }

  /* RAIN FORECAST */
  .forecast-label {
    font-size: 0.6rem; color: rgba(255,255,255,0.35);
    font-family: 'DM Mono', monospace; letter-spacing: 0.1em;
    text-transform: uppercase; margin-bottom: 0.4rem; margin-top: 0.5rem;
  }
  .rain-bars {
    display: flex; align-items: flex-end; gap: 3px; height: 50px; margin-bottom: 0.3rem;
  }
  .rain-bar-wrap { flex: 1; height: 100%; display: flex; align-items: flex-end; }
  .rain-bar {
    width: 100%; border-radius: 3px 3px 0 0; min-height: 3px;
    transition: height 0.5s ease;
  }
  .rain-bar.none { background: rgba(255,255,255,0.1); border-radius: 3px; height: 3px !important; }
  .rain-bar.light { background: rgba(127,179,211,0.5); }
  .rain-bar.medium { background: rgba(127,179,211,0.8); }
  .rain-bar.heavy { background: #7fb3d3; box-shadow: 0 0 6px rgba(127,179,211,0.5); }
  .rain-bar-times {
    display: flex; justify-content: space-between;
    font-family: 'DM Mono', monospace; font-size: 0.5rem; color: rgba(255,255,255,0.25);
    margin-bottom: 0.5rem;
  }

</style>
</head>
<body class="bg-day">

<div class="stars" id="stars"></div>

<div id="dashboard">

    </div>

</div>

<script>
const CLIENT_ID     = '69a01b0127352105b600c628';
const CLIENT_SECRET = 'XIWW9GLp6M13ssyarLGHENlptMMnP';
const REDIRECT_URI  = 'https://southernjuju.github.io/meteo';
const SCOPE         = 'read_station';

function saveTokens(a,r,e){localStorage.setItem('na_access',a);localStorage.setItem('na_refresh',r);localStorage.setItem('na_expiry',e);}
function getAccessToken(){return localStorage.getItem('na_access');}
function getRefreshToken(){return localStorage.getItem('na_refresh');}
function getExpiry(){return parseInt(localStorage.getItem('na_expiry')||'0');}
function clearTokens(){['na_access','na_refresh','na_expiry'].forEach(k=>localStorage.removeItem(k));}

function startAuth(){
  const state=Math.random().toString(36).substring(2);
  sessionStorage.setItem('oauth_state',state);
  window.location.href=`https://api.netatmo.com/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(SCOPE)}&state=${state}&response_type=code&prompt=consent`;
}

async function handleCallback(code){
  showLoading(true);
  try{
    const resp=await fetch('https://api.netatmo.com/oauth2/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'authorization_code',client_id:CLIENT_ID,client_secret:CLIENT_SECRET,code,redirect_uri:REDIRECT_URI})});
    const data=await resp.json();
    if(data.access_token){saveTokens(data.access_token,data.refresh_token,Date.now()+data.expires_in*1000);window.history.replaceState({},'',window.location.pathname);await loadDashboard();}
    else showError();
  }catch(e){showError();}
  showLoading(false);
}

async function refreshToken(){
  const resp=await fetch('https://api.netatmo.com/oauth2/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'refresh_token',client_id:CLIENT_ID,client_secret:CLIENT_SECRET,refresh_token:getRefreshToken()})});
  const data=await resp.json();
  if(data.access_token){saveTokens(data.access_token,data.refresh_token,Date.now()+data.expires_in*1000);return data.access_token;}
  throw new Error('Refresh failed');
}

async function getValidToken(){
  if(getExpiry()-Date.now()<60000)return await refreshToken();
  return getAccessToken();
}

async function loadDashboard(){
  try{
    const token=await getValidToken();
    const stationResp=await fetch('https://api.netatmo.com/api/getstationsdata?get_favorites=false',{headers:{Authorization:`Bearer ${token}`}});
    const data=await stationResp.json();
    if(data.body&&data.body.devices){
      const device=data.body.devices[0];
      const lat=device.place&&device.place.location?device.place.location[1]:47.28;
      const lon=device.place&&device.place.location?device.place.location[0]:-1.78;
      const meteo=await fetchOpenMeteo(lat,lon);
      renderDashboard(data.body.devices, meteo);
    }
  }catch(e){console.error(e);}
}

async function fetchOpenMeteo(lat, lon){
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&minutely_15=precipitation&hourly=windspeed_10m&daily=sunrise,sunset&forecast_minutely_15=5&forecast_days=1&timezone=auto&models=meteofrance_seamless`;
    const resp=await fetch(url);
    const data=await resp.json();
    const result={rainForecast:null, windSpeed:null, sunrise:null, sunset:null};

    // Rain forecast bars
    if(data.minutely_15&&data.minutely_15.precipitation){
      const vals=data.minutely_15.precipitation.slice(0,4);
      const bars=[];
      vals.forEach(v=>{ bars.push(v,v,v); });
      result.rainForecast=bars;
    }

    // Current wind speed (first hourly value)
    if(data.hourly&&data.hourly.windspeed_10m){
      const h=new Date().getHours();
      result.windSpeed=data.hourly.windspeed_10m[h];
    }

    // Sunrise/sunset
    if(data.daily){
      result.sunrise=data.daily.sunrise?data.daily.sunrise[0]:null;
      result.sunset=data.daily.sunset?data.daily.sunset[0]:null;
    }

    return result;
  }catch(e){console.error('Open-Meteo error',e);}
  return {};
}



function feelsLike(temp, humidity, windKmh){
  // Wind chill (when cold) + heat index (when warm)
  const wind = windKmh || 0;
  if(temp <= 10 && wind > 4.8){
    // Wind chill formula
    const wc = 13.12 + 0.6215*temp - 11.37*Math.pow(wind,0.16) + 0.3965*temp*Math.pow(wind,0.16);
    return Math.round(wc*10)/10;
  } else if(temp >= 27){
    // Heat index
    const hi = -8.78469475556 + 1.61139411*temp + 2.3385248*humidity
               - 0.14611605*temp*humidity - 0.012308094*temp*temp
               - 0.016424828*humidity*humidity + 0.002211732*temp*temp*humidity
               + 0.00072546*temp*humidity*humidity - 0.000003582*temp*temp*humidity*humidity;
    return Math.round(hi*10)/10;
  }
  return fmt(temp);
}

function initSunArc(sunriseStr, sunsetStr){
  const rise=new Date(sunriseStr);
  const set=new Date(sunsetStr);
  window._sunrise=rise; window._sunset=set;
  updateSunArc();
  setInterval(updateSunArc, 30000);
  // Update labels
  const pad=n=>n.toString().padStart(2,'0');
  const rLabel=document.getElementById('sunrise-label');
  const sLabel=document.getElementById('sunset-label');
  if(rLabel) rLabel.textContent=pad(rise.getHours())+':'+pad(rise.getMinutes());
  if(sLabel) sLabel.textContent=pad(set.getHours())+':'+pad(set.getMinutes());
}

function arcPoint(t, w=300, h=62, margin=10){
  const x=margin+t*(w-2*margin);
  const y=h-Math.sin(t*Math.PI)*(h-8);
  return {x,y};
}

function buildArcPath(from=0, to=1, steps=60){
  let d='';
  for(let i=0;i<=steps;i++){
    const t=from+(to-from)*(i/steps);
    const p=arcPoint(t);
    d+=(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)+' ';
  }
  return d;
}

function updateSunArc(){
  if(!window._sunrise||!window._sunset) return;
  const now=new Date();
  const nowMs=now.getTime();
  const riseMs=window._sunrise.getTime();
  const setMs=window._sunset.getTime();
  let t=(nowMs-riseMs)/(setMs-riseMs);
  t=Math.max(0,Math.min(1,t));
  const bgEl=document.getElementById('arc-bg');
  const pgEl=document.getElementById('arc-progress');
  const sunEl=document.getElementById('sun-icon');
  if(bgEl) bgEl.setAttribute('d',buildArcPath(0,1));
  if(pgEl) pgEl.setAttribute('d',buildArcPath(0,t));
  if(sunEl){
    const pos=arcPoint(t);
    sunEl.setAttribute('x',pos.x);
    sunEl.setAttribute('y',pos.y);
    sunEl.textContent=(t>0&&t<1)?'☀️':'🌙';
  }
}
function renderRainBars(forecast){
  const el = document.getElementById('rain-bars');
  if(!el) return;
  el.innerHTML = '';
  
  // Use forecast data if available, otherwise show empty bars
  const data = forecast && forecast.length > 0 
    ? forecast.slice(0, 12) 
    : Array(12).fill(0);
  
  const maxVal = Math.max(...data, 0.5);
  
  data.forEach(v => {
    const wrap = document.createElement('div');
    wrap.className = 'rain-bar-wrap';
    const bar = document.createElement('div');
    const heightPct = Math.max((v / maxVal) * 100, 5);
    bar.style.height = heightPct + '%';
    bar.className = 'rain-bar ' + (v === 0 ? 'none' : v < 1 ? 'light' : v < 3 ? 'medium' : 'heavy');
    wrap.appendChild(bar);
    el.appendChild(wrap);
  });
}
function windDir(deg){return['N','NE','E','SE','S','SO','O','NO'][Math.round(deg/45)%8];}
function co2Class(v){return v<1000?'co2-good':v<1500?'co2-med':'co2-bad';}
function fmt(v){if(v==null)return'—';return typeof v==='number'?(Number.isInteger(v)?v:v.toFixed(1)):v;}

const MODULE_ICONS = { indoor1:'🏠', outdoor:'🌡️', extra:'🚪', rain:'🌧️', wind:'💨' };

function renderDashboard(devices, meteo){
  document.getElementById('auth-screen').style.display='none';
  const dash=document.getElementById('dashboard'); dash.style.display='flex';
  const device=devices[0];
  document.getElementById('station-name').textContent=(device.station_name||device.home_name||'Ma station').toUpperCase();
  document.getElementById('last-update').textContent='🔄 Mis à jour à '+new Date(device.last_status_store*1000).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  const modules=[];
  if(device.dashboard_data)modules.push({type:'indoor1',name:device.module_name||'Intérieur',data:device.dashboard_data,css:'card-indoor1'});
  for(const mod of(device.modules||[])){
    const d=mod.dashboard_data||{};
    if(mod.type==='NAModule1')modules.push({type:'outdoor',name:mod.module_name||'Extérieur',data:d,css:'card-outdoor',windSpeed:meteo.windSpeed});
    else if(mod.type==='NAModule4')modules.push({type:'extra',name:mod.module_name||'Intérieur',data:d,css:'card-extra'});
    else if(mod.type==='NAModule3')modules.push({type:'rain',name:mod.module_name||'Pluie',data:d,css:'card-rain',forecast:meteo.rainForecast});
    else if(mod.type==='NAModule2')modules.push({type:'wind',name:mod.module_name||'Vent',data:d,css:'card-wind'});
  }
  for(const mod of modules){const c=createCard(mod);grid.appendChild(c);if(mod.type==="rain")renderRainBars(meteo.rainForecast);}
  // Clock card
  const clockCard=document.createElement('div');
  clockCard.className='card card-clock';
  clockCard.innerHTML=`
    <div class="big-clock" id="big-clock"></div>
    <div class="big-date" id="big-date"></div>
    <div class="sun-arc-wrap">
      <svg class="sun-arc-svg" id="sun-svg" viewBox="0 0 300 70" preserveAspectRatio="none">
        <path class="arc-dashed" id="arc-bg" d=""/>
        <path class="arc-glow" id="arc-progress" d=""/>
        <line x1="10" y1="62" x2="290" y2="62" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <text id="sun-icon" font-size="16" text-anchor="middle" dominant-baseline="middle"></text>
      </svg>
      <div class="sun-labels">
        <span class="sun-time" id="sunrise-label"></span>
        <span class="sun-time" id="sunset-label"></span>
      </div>
    </div>
  `;
  grid.appendChild(clockCard);
  updateBigClock();
  if(meteo.sunrise&&meteo.sunset) initSunArc(meteo.sunrise, meteo.sunset);
}

function createCard(mod){
  const card=document.createElement('div');
  card.className=`card ${mod.css}`;
  const d=mod.data;
  const icon=MODULE_ICONS[mod.type]||'📊';
  let html=`<div class="card-header"><span class="card-name">${icon} ${mod.name}</span><div class="live-dot" style="background:${dotColor(mod.type)}"></div></div>`;

  if(['indoor1','outdoor','extra'].includes(mod.type)){
    html+=`<div class="big-temp">${fmt(d.Temperature)}<span class="deg">°C</span></div>`;
    html+='<div class="metrics">';
    // Fixed rows for alignment across cards
    html+=mrow('💧','Humidité',fmt(d.Humidity),'%');
    if(mod.type==='outdoor'){
      const fl=feelsLike(d.Temperature, d.Humidity, mod.windSpeed);
      html+=`<div class="metric"><span class="metric-label">🌡️ Ressenti</span><span class="metric-value">${fl}<span class="unit">°C</span></span></div>`;
    } else {
      if(d.CO2!=null) html+=`<div class="metric"><span class="metric-label">🌬️ CO₂</span><span class="metric-value ${co2Class(d.CO2)}">${d.CO2}<span class="unit"> ppm</span></span></div>`;
      else html+=mrowEmpty();
    }
    if(d.Noise!=null) html+=mrow('🔊','Bruit',fmt(d.Noise),'dB');
    else html+=mrowEmpty();
    if(d.Pressure!=null) html+=mrow('⏱️','Pression',Math.round(d.Pressure),'hPa');
    else html+=mrowEmpty();
    html+='</div>';
  } else if(mod.type==='rain'){
    html+=`<div class="metrics">`;
    html+=mrow('🌧️','Maintenant',fmt(d.Rain),'mm/h');
    html+=`</div>`;
    html+=`<div class="forecast-label">Prévisions · 60 min</div>`;
    html+=`<div class="rain-bars" id="rain-bars"></div>`;
    html+=`<div class="rain-bar-times"><span>maint.</span><span>+15</span><span>+30</span><span>+45</span><span>+60min</span></div>`;
    html+=`<div class="metrics">`;
    html+=mrow('⏱️','Dernière heure',fmt(d.sum_rain_1),'mm');
    html+=mrow('📅',"Aujourd'hui",fmt(d.sum_rain_24),'mm');
    html+=`</div>`;
  } else if(mod.type==='wind'){
    html+='<div class="metrics">';
    html+=mrow('💨','Vitesse',fmt(d.WindStrength),'km/h');
    html+=mrow('🧭','Direction',d.WindAngle!=null?`${windDir(d.WindAngle)} ${d.WindAngle}°`:'—','');
    html+=mrow('⚡','Rafales',fmt(d.GustStrength),'km/h');
    html+='</div>';
  }
  card.innerHTML=html;
  return card;
}

function dotColor(type){
  return {indoor1:'#58d68d',outdoor:'#5dade2',extra:'#f0b27a',rain:'#7fb3d3',wind:'#bb8fce'}[type]||'#58d68d';
}

function mrowEmpty(){ return `<div class="metric empty"><span class="metric-label" style="opacity:0">—</span><span class="metric-value" style="opacity:0">—</span></div>`; }
function mrow(ico,label,value,unit){
  return `<div class="metric"><span class="metric-label">${ico} ${label}</span><span class="metric-value">${value}<span class="unit">${unit}</span></span></div>`;
}

// Clocks
function updateBigClock(){
  const tc=document.getElementById('big-clock');
  const td=document.getElementById('big-date');
  if(tc)tc.textContent=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  if(td)td.textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
}
setInterval(updateBigClock,1000);

function updateTopClock(){
  const tt=document.getElementById('top-clock');
  if(tt)tt.textContent=new Date().toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})+' · '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
setInterval(updateTopClock,1000);
updateTopClock();

// Auto theme
function autoTheme(){
  const h=new Date().getHours();
  let t;
  if(h>=6&&h<8)t='dawn';
  else if(h>=8&&h<18)t='day';
  else if(h>=18&&h<21)t='sunset';
  else t='night';
  document.body.className='bg-'+t+(t==='night'?' night':'');
}
autoTheme();
setInterval(autoTheme,60000);

// Stars
const starsEl=document.getElementById('stars');
for(let i=0;i<80;i++){
  const s=document.createElement('div');s.className='star';
  const sz=Math.random()*2.5+0.5;
  s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-delay:${Math.random()*3}s;animation-duration:${2+Math.random()*3}s`;
  starsEl.appendChild(s);
}

// Data refresh
setInterval(async()=>{if(getAccessToken())await loadDashboard();},5*60*1000);

function showLoading(v){document.getElementById('loading').style.display=v?'flex':'none';}
function showError(){showLoading(false);document.getElementById('error-msg').style.display='block';}
function logout(){clearTokens();window.location.reload();}

async function init(){
  const params=new URLSearchParams(window.location.search);
  const code=params.get('code');
  if(code){await handleCallback(code);return;}
  if(getAccessToken()){showLoading(true);await loadDashboard();showLoading(false);return;}
}
init();
</script>
